<style>
:root{
  --verde:#1E5631; --verde-osc:#173F26; --oliva:#556B2F; --piedra:#7B7D7D; --grafito:#26302A;
  --oro:#B8923A; --oro-claro:#E6D3A3; --oro-txt:#7A5C17; --marfil:#F4F1EA;
  --fondo:#F4F1EA; --tarjeta:#FFFFFF; --texto:#23302A; --suave:#555E58; --borde:#D3CBB8; --linea:#E6E0D2;
  --e-disponible:#2E7D4F; --e-tramite:#E2B33C; --e-ocupado:#9E3B2F; --e-reservado:#2F5D8A; --e-observado:#8A4B14;
  --serif:Georgia,"Times New Roman",serif;
  --enlace:#166B3A; --foco:#1F2421; --radio:14px; --error:#B03A2E; --alerta-txt:#873600; --ok-txt:#1D8348; --borde-campo:#8A968F; --sombra:0 2px 10px rgba(20,40,30,.07);
}
@media (prefers-color-scheme: dark){
  :root{ --fondo:#121614; --tarjeta:#1C2220; --texto:#E8EDEA; --suave:#B3BCB7; --borde:#45514B; --linea:#2E3733; --enlace:#7DD3A0; --foco:#E8EDEA; --sombra:none; --error:#F1948A; --alerta-txt:#F0B27A; --ok-txt:#7DD3A0; --borde-campo:#7F8C86; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--texto);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.saludo,.titulo-sec{font-family:var(--serif);font-weight:700;letter-spacing:.2px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.barra{background:var(--verde-osc);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{font-weight:800;font-size:18px;letter-spacing:.2px;flex:1;min-width:200px;background:none;border:0;color:#fff;text-align:left;padding:6px 0}
.marca small{display:block;font-weight:400;font-size:13px;opacity:.85}
.barra label{font-size:13px;opacity:.9}
.barra select{background:#fff;color:#1F2421;border:0;border-radius:10px;padding:8px 10px;min-height:40px;font-weight:600}
.demo{background:#FEF9E7;color:#5E4D05;font-size:14px;padding:8px 20px;border-bottom:1px solid #F4E3A1}
@media (prefers-color-scheme: dark){.demo{background:#2A2610;color:#E8D67A;border-color:#4A4220}}
@media (prefers-color-scheme: dark){
  :root{--oro-txt:#E6C77A;--marfil:#1F2622}
  .saludo,.kpi-p strong,.sector-btn strong,.titulo-sec,.lt-hora{color:var(--texto)}
  .heroe .banner,img.escudo{background:#F4F1EA;border-radius:12px;padding:6px 10px}
}
.contenido{max-width:1320px;margin:0 auto;padding:20px}
h1{font-size:24px;margin:4px 0 4px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 8px}
.suave{color:var(--suave)}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);box-shadow:0 1px 2px rgba(60,50,20,.05),0 6px 20px rgba(60,50,20,.05);padding:18px}
/* Cabecera (formato InspectApp) */
.cabecera{position:sticky;top:0;z-index:15;background:linear-gradient(180deg,#1B3A26,#173322);color:#fff;border-bottom:3px solid var(--oro)}
.cab-sup{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 20px;flex-wrap:wrap}
.cabecera .marca{display:flex;align-items:center;gap:12px;flex:1;min-width:240px;background:none;border:0;color:#fff;text-align:left;padding:4px 0}
.cabecera .marca img{height:50px;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.cabecera .marca strong{display:block;font-family:var(--serif);font-size:19px;letter-spacing:.6px}
.cabecera .marca small{display:block;font-size:12.5px;color:var(--oro-claro);letter-spacing:.8px;text-transform:uppercase}
.usuario{display:flex;align-items:center;gap:8px}
.usuario label{font-size:13px;color:var(--oro-claro)}
.usuario select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(230,211,163,.5);border-radius:10px;padding:7px 10px;min-height:40px;font-weight:600}
.usuario select option{color:#23302A}
.avatar-u{width:36px;height:36px;border-radius:50%;background:var(--oro);color:#1B3A26;display:grid;place-items:center;font-weight:800}
.nombre-u{font-weight:600;font-size:14px}
.solapas{max-width:1320px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:thin}
.solapas button{background:none;border:0;color:#E8EFE9;padding:11px 16px 12px;font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap;min-height:46px}
.solapas button:hover{color:#fff;background:rgba(255,255,255,.06)}
.solapas button[aria-current="page"]{color:#fff;border-bottom-color:var(--oro-claro);background:rgba(255,255,255,.08)}
/* Portada */
.heroe{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:6px 0 12px}
.saludo{font-size:30px;margin:0;color:var(--verde-osc)}
.fecha{margin:2px 0 0;color:var(--suave)}
.heroe .banner{height:78px;max-width:100%;width:auto}
.kpis-portada{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi-p{background:var(--tarjeta);border:1px solid var(--borde);border-top:4px solid var(--oro);border-radius:14px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:86px}
.kpi-p:hover:not([disabled]){border-color:var(--oro);transform:translateY(-1px)}
.kpi-p strong{font-family:var(--serif);font-size:28px;color:var(--verde-osc);line-height:1.1}
.kpi-p span{color:var(--suave);font-size:14px}
.kpi-p[disabled]{cursor:default;opacity:1}
.portada-grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:16px;align-items:start}
.portada-lat{display:flex;flex-direction:column;gap:16px}
.plano-vivo{position:relative;padding:16px}
.pv-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pv-cab h2{margin:0}
.seg-chico button{min-height:36px;padding:6px 12px;font-size:14px}
.pv-lienzo{position:relative}
.pv-tip[hidden]{display:none}
.pv-tip{position:absolute;z-index:3;width:216px;background:#fff;border:1px solid var(--borde);border-left:4px solid var(--oro);border-radius:12px;padding:10px 12px;box-shadow:0 10px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;pointer-events:none;color:#23302A}
.pv-tip em{color:#7A5C17;font-size:13px}
.pv-ley{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.pv-grad{display:inline-block;width:140px;height:12px;border-radius:6px;border:1px solid var(--borde)}
.plano.vivo .p-sector{animation:aparece .7s ease-out both}
.plano.vivo .p-sector polygon{transition:fill .5s ease,filter .2s}
.plano.vivo .p-sector:hover polygon,.plano.vivo .p-sector:focus-visible polygon{filter:brightness(1.12) drop-shadow(0 0 6px rgba(184,146,58,.9))}
@keyframes aparece{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.plano.vivo .p-sector{animation:none}}
.titulo-sec{font-size:22px;margin:22px 0 12px;color:var(--verde-osc)}
.sectores{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sector-btn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:18px;min-height:176px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.sector-btn::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:var(--acento,var(--verde))}
.sector-btn:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(60,50,20,.12);border-color:var(--oro)}
.sb-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--acento,var(--verde));color:#fff}
.sb-ico svg{width:28px;height:28px}
.sector-btn strong{font-family:var(--serif);font-size:18px;color:var(--verde-osc)}
.sb-desc{color:var(--suave);font-size:14px}
.sb-cont{margin-top:auto;font-weight:700;color:var(--oro-txt);font-size:14px}
.s-direccion{--acento:#4A3B5C}.s-ventas{--acento:#1E5631}.s-caja{--acento:#7A5C17}.s-campo{--acento:#556B2F}.s-crem{--acento:#6E3B2F}.s-mi{--acento:#2F5D8A}
.s-pcoch{--acento:#5C4033}.s-pfam{--acento:#8A6D2B}.s-pcoch,.s-pfam{border-style:dashed}
.linea-tiempo{list-style:none;margin:0;padding:0;border-left:2px solid var(--linea)}
.linea-tiempo li{margin:0 0 4px 0}
.linea-tiempo li > *{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:7px 8px 7px 12px;border-radius:10px;min-height:44px}
.linea-tiempo li button:hover{background:var(--linea)}
.linea-tiempo li.pasado{opacity:.55}
.lt-hora{font-weight:800;font-variant-numeric:tabular-nums;min-width:46px;color:var(--verde-osc)}
.lt-ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--verde);flex:none}
.lt-ico svg{width:17px;height:17px}
.lt-ico.cremacion{background:#6E3B2F}.lt-ico.inhumacion{background:#2F5D8A}.lt-ico.capilla{background:#4A3B5C}.lt-ico.tarea{background:#556B2F}
#ser-querido,#pf-buscar{width:100%;border:2px solid var(--borde-campo);border-radius:12px;padding:11px 12px;min-height:46px;background:var(--tarjeta)}
.arbol{width:18px;height:18px;color:var(--oro-txt);flex:none;vertical-align:-3px}
.arbol.chico{width:16px;height:16px}
.zona-nom{display:inline-flex;align-items:center;gap:6px}
.mi-datos{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:start}
.mi-datos .escudo{width:100%;height:auto}
.accesos{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.accesos .boton{justify-content:flex-start}
@media (max-width:1100px){.kpis-portada{grid-template-columns:repeat(3,1fr)}.portada-grid{grid-template-columns:1fr}}
@media (max-width:600px){.kpis-portada{grid-template-columns:repeat(2,1fr)}.mi-datos{grid-template-columns:1fr}.mi-datos .escudo{max-width:160px}.heroe .banner{height:54px}.saludo{font-size:24px}}
/* Inicio */
.inicio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
.modulo{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:0;border-radius:18px;padding:22px;color:#fff;min-height:190px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.modulo:hover{transform:translateY(-2px)}
.modulo svg{width:40px;height:40px}
.modulo strong{font-size:19px}
.modulo span{font-size:14px;opacity:.95}
.modulo .estado-mod{margin-top:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:8px}
/* Barra de herramientas del módulo */
.volver{background:none;border:0;color:var(--enlace);font-weight:700;padding:8px 0;min-height:44px}
.herr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 14px}
.seg{display:inline-flex;border:2px solid var(--borde);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--tarjeta);padding:8px 14px;font-weight:700;min-height:42px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--verde);color:#fff}
.buscar{flex:1;min-width:220px;display:flex;gap:8px}
.buscar input{flex:1;border:2px solid var(--borde-campo);border-radius:12px;padding:9px 12px;background:var(--tarjeta);min-height:44px}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-bottom:12px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.muestra{width:16px;height:16px;border-radius:4px;display:inline-block}
.boton{border:0;border-radius:12px;padding:10px 16px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.boton.primario{background:var(--verde);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.boton.secundario{background:var(--tarjeta);border:2px solid var(--enlace);color:var(--enlace)}
.boton.peligro{background:var(--tarjeta);border:2px solid var(--error);color:var(--error)}
.boton:disabled{background:var(--linea);color:var(--suave);border-color:var(--linea);cursor:not-allowed}
.boton svg{width:20px;height:20px}
/* Mapa */
.vistas{display:grid;gap:16px}
.vistas.dividida{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1100px){.vistas.dividida{grid-template-columns:minmax(0,1fr)}}
.op-titulo{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.op-chip{color:#fff;border-radius:8px;padding:2px 8px;font-size:13px}
.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.zona{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);padding:10px}
.zona h3{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.zona h3 small{font-weight:400;color:var(--suave)}
.grilla{display:grid;gap:3px}
.celda{border:0;border-radius:6px;min-height:40px;font-size:11px;font-weight:700;padding:3px 0 0;color:#fff;position:relative;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;transition:opacity .2s,filter .2s}
.celda > svg{width:11px;height:11px;opacity:.85}
.celda.apagada{opacity:.22;filter:grayscale(1)}
.rayitas{display:flex;flex-direction:column;gap:2px;margin-top:auto;margin-bottom:3px;width:62%}
.rayitas i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.rayitas i.ataud{background:#fff}
.rayitas i.urnas{background:#F2D78C}
.rayitas.ej{width:22px;display:inline-flex;background:#5A4A3A;padding:3px;border-radius:4px}
.ley-ray{display:inline-flex;align-items:center;gap:6px}
.modo-venta[aria-pressed="true"]{box-shadow:0 0 0 3px var(--oro-claro)}
.celda.disponible{background:var(--e-disponible)}
.celda.tramite{background:var(--e-tramite);color:#3D3200}
.celda.tramite .rayitas i,.celda.mio .rayitas i{background:rgba(0,0,0,.18)}.celda.tramite .rayitas i.ataud,.celda.mio .rayitas i.ataud{background:#3D3200}
.celda.mio{background:var(--e-tramite);color:#3D3200;box-shadow:inset 0 0 0 3px #1F2421}
.celda.ocupado{background:var(--e-ocupado)}
.celda.reservado{background:var(--e-reservado)}
.celda.observado{background:var(--e-observado)}
.celda.elegida{outline:3px solid var(--foco);outline-offset:2px;z-index:1}
.celda.hallada{animation:pulso 1s ease-in-out 4;outline:4px solid #F4D03F;outline-offset:2px;z-index:2}
@keyframes pulso{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){.celda.hallada{animation:none}}
.edificio{display:flex;flex-direction:column;gap:8px;align-items:flex-start;justify-content:center;min-height:120px;border:2px dashed var(--borde);border-radius:12px;padding:12px;width:100%;background:none;text-align:left}
.provisorio{font-size:13px;color:var(--suave);margin:6px 0 0}
.plano{width:100%;height:auto;display:block;border-radius:16px;background:#FBFAF5;border:1px solid var(--borde)}
.p-fondo{fill:#FBFAF5}
.p-pasto{fill:#AFC27A;pointer-events:none}
.p-sector polygon{fill:#AFC27A;transition:fill .15s}
.p-sector{cursor:pointer;outline:none}
.p-sector:hover polygon,.p-sector:focus-visible polygon{fill:#8FAA55}
.p-sector:focus-visible polygon{stroke:#1F2421;stroke-width:5}
.p-sector.p-lleno polygon{fill:#C7CBB4}

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
