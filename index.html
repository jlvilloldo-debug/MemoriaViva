<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#1D8348">
<title>Memoria Viva · Campo</title>
<style>
:root{
  --verde:#1D8348; --verde-osc:#145A32; --oliva:#556B2F; --piedra:#7B7D7D; --grafito:#2E3436;
  --fondo:#F4F6F3; --tarjeta:#FFFFFF; --texto:#1F2421; --suave:#4F5652; --borde:#B4BFB8;
  --c-cesped:#1D8348; --c-limpieza:#1F6FA8; --c-inhumacion:#2C3E8F; --c-traslado:#7D3C98; --c-reparacion:#A84F0C;
  --enlace:#166B3A; --foco:#1F2421;
  --ok:#1D8348; --alerta:#C0661A; --peligro:#B03A2E; --ambar:#B7950B;
  --radio:16px; --sombra:0 2px 10px rgba(20,40,30,.08);
}
@media (prefers-color-scheme: dark){
  :root{ --fondo:#121614; --tarjeta:#1C2220; --texto:#E8EDEA; --suave:#B3BCB7; --borde:#45514B; --sombra:none;
    --ok:#3CB371; --enlace:#7DD3A0; --foco:#E8EDEA; }
  .barra{border-bottom:1px solid #2E6B48}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--texto);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--foco);outline-offset:3px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:180px}
.barra{position:sticky;top:0;z-index:5;background:var(--verde-osc);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.barra h1{font-size:17px;margin:0;flex:1;letter-spacing:.2px}
.barra h1 small{display:block;font-weight:400;font-size:13px;opacity:.85}
.pill{border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.on{background:#D5F5E3;color:#145A32}
.pill.off{background:#FDEBD0;color:#7E4A0E}
.btn-mini{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;min-height:44px;min-width:56px}
.demo{background:#FEF9E7;color:#5E4D05;font-size:14px;padding:8px 16px;border-bottom:1px solid #F4E3A1}
@media (prefers-color-scheme: dark){.demo{background:#2A2610;color:#E8D67A;border-color:#4A4220}}
.contenido{padding:16px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px;margin-bottom:14px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.suave{color:var(--suave);font-size:15px}
/* Perfiles */
.perfil{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--tarjeta);border:2px solid var(--borde);border-radius:var(--radio);padding:16px;margin-bottom:12px;min-height:72px}
.perfil:active{transform:scale(.99)}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
/* Fichaje */
.fichaje{display:flex;align-items:center;gap:16px}
.reloj{flex:1}
.reloj .grande{font-size:30px;font-weight:700;line-height:1.1}
.boton-fichar{width:116px;height:116px;border-radius:50%;border:0;color:#fff;font-weight:800;font-size:15px;line-height:1.15;box-shadow:0 6px 16px rgba(0,0,0,.18);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.boton-fichar.entrar{background:var(--verde)}
.boton-fichar.salir{background:var(--peligro)}
.boton-fichar svg{width:30px;height:30px}
.estado-fichaje{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.punto{width:10px;height:10px;border-radius:50%}
/* Progreso */
.progreso{height:12px;background:var(--borde);border-radius:999px;overflow:hidden;margin-top:8px}
.progreso > div{height:100%;background:var(--verde);border-radius:999px;transition:width .4s}
.chips{display:flex;gap:8px;margin:4px 0 14px}
.chip{border:2px solid var(--borde);background:var(--tarjeta);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;min-height:48px}
.chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff}
/* Tareas */
.tarea{display:flex;width:100%;text-align:left;background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);box-shadow:var(--sombra);margin-bottom:12px;padding:0;overflow:hidden;min-height:88px}
.tarea .franja{width:8px;flex:none}
.tarea .cuerpo{flex:1;padding:14px 14px 14px 12px;display:flex;gap:12px;align-items:flex-start}
.icono{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.icono svg{width:24px;height:24px}
.tarea .titulo{font-weight:700;font-size:16px;margin-bottom:2px}
.tarea .lugar{font-size:14px;color:var(--suave)}
.etiquetas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.etq{font-size:13px;font-weight:700;border-radius:8px;padding:3px 8px}
.etq.pendiente{background:#EAECEE;color:#424949}
.etq.en_curso{background:#FCF3CF;color:#7D6608}
.etq.hecha{background:#D5F5E3;color:#145A32}
.etq.bloq{background:#FAE5D3;color:#873600}
.etq.hora{background:transparent;border:1px solid var(--borde);color:var(--suave)}
.vacio{text-align:center;padding:28px 12px;color:var(--suave)}
/* Detalle */
.volver{background:none;border:0;color:var(--enlace);font-weight:700;padding:8px 0;margin-bottom:6px;min-height:48px}
.cabecera-tarea{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.aviso{border-radius:14px;padding:14px;margin-bottom:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.aviso svg{width:24px;height:24px;flex:none}
.aviso.bloq{background:#FAE5D3;color:#6E2C00;border:2px solid #E59866}
.aviso.ok{background:#D5F5E3;color:#145A32;border:2px solid #82E0AA}
.paso{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--borde)}
.paso:first-of-type{border-top:0}
.num{width:30px;height:30px;border-radius:50%;background:var(--borde);display:grid;place-items:center;font-weight:800;flex:none}
.num.listo{background:var(--verde);color:#fff}
.paso .cont{flex:1;min-width:0}
.boton{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:16px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.boton svg{width:22px;height:22px}
.boton.primario{background:var(--verde);color:#fff;width:100%}
.boton.secundario{background:var(--tarjeta);border:2px solid var(--enlace);color:var(--enlace)}
.boton.falta{background:var(--tarjeta);border:2px dashed var(--suave);color:var(--texto);width:100%}
.boton:disabled{background:var(--borde);color:var(--suave);border-color:var(--borde);cursor:not-allowed}
.foto{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-top:8px;border:1px solid var(--borde)}
textarea{width:100%;min-height:84px;border:2px solid var(--borde);border-radius:12px;padding:10px;font:inherit;background:var(--tarjeta);color:var(--texto);resize:vertical}
.fila-dato{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--borde);font-size:15px}
.fila-dato:last-child{border-bottom:0}
.fila-dato span:last-child{font-weight:700;text-align:right}
/* Horas */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:12px}
.kpi .v{font-size:22px;font-weight:800}
.kpi .l{font-size:13px;color:var(--suave)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--borde)}
th{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:right}
/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tarjeta);border-top:1px solid var(--borde);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--suave);min-height:64px}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--verde)}
/* Aviso flotante */
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--grafito);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);width:520px;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600}
.toast[hidden]{display:none}
.toast button{background:none;border:2px solid #fff;color:#fff;border-radius:12px;padding:8px 14px;font-weight:800;flex:none;min-height:48px}
.toast span{flex:1}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pie{text-align:center;font-size:12px;color:var(--suave);padding:8px 16px 20px}
.enlace{background:none;border:0;color:var(--peligro);font-weight:700;text-decoration:underline;padding:12px;min-height:48px}
.indicaciones{font-size:17px;line-height:1.5;margin:6px 0 0}
.etq.alerta{background:#FAE5D3;color:#873600}
.aviso .accion{display:block;font-weight:400;margin-top:6px}
.aviso .boton{margin-top:10px;width:100%}
.hora-foto{font-size:14px;color:var(--suave);margin-top:4px}
.aviso.atencion{background:#FEF5E7;color:#6E2C00;border:2px solid #F0B27A}
</style>

<div class="app" id="app"></div>
<nav class="nav" id="nav" aria-label="Secciones" hidden><div class="in" id="nav-in"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-txt"></span><button id="toast-btn" type="button" hidden>Deshacer</button></div>
<script>// Lógica pura de la app de campo (sin DOM). Se prueba con node y se inserta en el HTML.
(function (raiz) {
  'use strict';
  var MAX_FOTO = 200000;      // caracteres base64 (~150 KB) por foto (H4: cuidar el espacio del celular)
  var MAX_FICHAJES = 2000;
  var MAX_NOTA = 500;
  var ESTADOS = ['pendiente', 'en_curso', 'hecha'];

  function esEventoValido(e) {
    return !!e && typeof e === 'object' && (e.tipo === 'entrada' || e.tipo === 'salida') &&
      typeof e.ts === 'number' && isFinite(e.ts) && e.ts > 0;
  }

  var MAX_TURNO = 14 * 3600000;   // un turno de más de 14 h se considera olvido y se manda a revisar
  var TOLERANCIA_FUTURO = 5 * 60000;

  // Arma los turnos respetando el orden en que se marcaron los fichajes.
  // Devuelve turnos válidos (asignados al día de la entrada) y las horas de cada registro a revisar.
  function armarTurnos(eventos, ahora) {
    var r = { turnos: [], anomalias: [], invalidos: 0, abierto: null, vencido: null };
    if (!Array.isArray(eventos)) return r;
    var limite = typeof ahora === 'number' && isFinite(ahora) ? ahora : Infinity;
    var ultimo = -Infinity, abierto = null;
    for (var i = 0; i < eventos.length; i++) {
      var e = eventos[i];
      if (!esEventoValido(e)) { r.invalidos++; continue; }
      if (e.ts > limite + TOLERANCIA_FUTURO) { r.anomalias.push(e.ts); continue; }
      if (e.ts < ultimo) {
        // Reloj atrasado: la salida cierra el turno pero no se suma; la entrada se ignora.
        if (e.tipo === 'salida' && abierto !== null) { r.anomalias.push(abierto); abierto = null; }
        else r.anomalias.push(e.ts);
        continue;
      }
      ultimo = e.ts;
      if (e.tipo === 'entrada') {
        if (abierto === null) abierto = e.ts;
        else if (e.ts - abierto > MAX_TURNO) { r.anomalias.push(abierto); abierto = e.ts; }
        else r.anomalias.push(e.ts);
      } else if (abierto === null) {
        r.anomalias.push(e.ts);
      } else {
        if (e.ts - abierto > MAX_TURNO) r.anomalias.push(abierto);
        else r.turnos.push({ ini: abierto, fin: e.ts });
        abierto = null;
      }
    }
    if (abierto !== null) {
      if (limite !== Infinity && limite - abierto > MAX_TURNO) { r.anomalias.push(abierto); r.vencido = abierto; }
      else { r.abierto = abierto; if (limite !== Infinity) r.turnos.push({ ini: abierto, fin: Math.max(abierto, limite), enCurso: true }); }
    }
    return r;
  }

  // Suma los turnos cuya ENTRADA cae dentro de [desde, hasta). Turno en curso cuenta hasta "ahora".
  function calcularHoras(eventos, desde, hasta, ahora) {
    var t = armarTurnos(eventos, ahora);
    var ms = 0, anomalias = t.invalidos;
    t.turnos.forEach(function (x) { if (x.ini >= desde && x.ini < hasta) ms += x.fin - x.ini; });
    t.anomalias.forEach(function (ts) { if (ts >= desde && ts < hasta) anomalias++; });
    return { ms: ms, anomalias: anomalias };
  }

  function dividirJornada(ms, jornadaHoras) {
    var min = Math.floor(Math.max(0, Number(ms) || 0) / 60000);
    var tope = Math.max(0, Number(jornadaHoras) || 0) * 60;
    return { normalesMin: Math.min(min, tope), extrasMin: Math.max(0, min - tope) };
  }

  function formatoDuracion(ms) {
    var min = Math.floor(Math.max(0, Number(ms) || 0) / 60000);
    var h = Math.floor(min / 60), m = min % 60;
    return h + ' h ' + (m < 10 ? '0' : '') + m + ' min';
  }

  function estadoFichaje(eventos, ahora) {
    return armarTurnos(eventos, ahora).abierto !== null ? 'dentro' : 'fuera';
  }

  // Hora de una entrada que quedó abierta más de 14 h (olvido de salida), o null.
  function turnoVencido(eventos, ahora) {
    return armarTurnos(eventos, ahora).vencido;
  }

  // Celda CSV que Excel nunca interpreta como fórmula.
  function csvSeguro(valor) {
    var s = valor === null || valor === undefined ? '' : String(valor);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function esFotoValida(v) {
    if (typeof v !== 'string') return false;
    var pre = 'data:image/jpeg;base64,';
    if (v.indexOf(pre) !== 0) return false;
    var cuerpo = v.slice(pre.length);
    return cuerpo.length > 0 && cuerpo.length <= MAX_FOTO && /^[A-Za-z0-9+/]+={0,2}$/.test(cuerpo);
  }

  function puedeCompletar(t) {
    if (!t || typeof t !== 'object') return { ok: false, motivo: 'Tarea inexistente.' };
    if (t.judicial) return { ok: false, motivo: 'Caso judicial: no toques esta parcela hasta que Administración avise que llegó la orden del juez.' };
    if (t.tipo === 'traslado' && t.autorizado !== true) return { ok: false, motivo: 'Falta la autorización firmada de la familia. No hagas el traslado hasta que Administración avise que la tiene.' };
    if (!t.fotoAntes) return { ok: false, motivo: 'Falta la foto de ANTES.' };
    if (!t.fotoDespues) return { ok: false, motivo: 'Falta la foto de DESPUÉS.' };
    return { ok: true, motivo: '' };
  }

  function propia(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  function sanearUbicacion(u) {
    if (!u || typeof u !== 'object') return null;
    var lat = Number(u.lat), lon = Number(u.lon), p = Number(u.precision);
    if (!isFinite(lat) || !isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
    return { lat: lat, lon: lon, precision: isFinite(p) && p >= 0 ? Math.round(p) : null };
  }

  // Valida todo lo que viene del almacenamiento local antes de usarlo.
  function sanearEstado(raw, idsValidos) {
    if (!raw || typeof raw !== 'object' || raw.version !== 1) return null;
    var op = typeof raw.operario === 'string' && /^[a-z0-9_-]{1,20}$/.test(raw.operario) ? raw.operario : null;
    var MIN_TS = Date.UTC(2020, 0, 1), MAX_TS = Date.UTC(2100, 0, 1);
    var fich = Array.isArray(raw.fichajes) ? raw.fichajes.filter(function (e) { return esEventoValido(e) && e.ts >= MIN_TS && e.ts <= MAX_TS; })
      .map(function (e) {
        return { tipo: e.tipo, ts: e.ts, op: typeof e.op === 'string' && /^[a-z0-9_-]{1,20}$/.test(e.op) ? e.op : null };
      }) : [];
    if (fich.length > MAX_FICHAJES) fich = fich.slice(fich.length - MAX_FICHAJES);
    var tareas = Object.create(null);
    var src = raw.tareas && typeof raw.tareas === 'object' ? raw.tareas : {};
    (idsValidos || []).forEach(function (id) {
      if (!propia(src, id)) return;
      var t = src[id];
      if (!t || typeof t !== 'object') return;
      var o = {
        estado: ESTADOS.indexOf(t.estado) >= 0 ? t.estado : 'pendiente',
        fotoAntes: esFotoValida(t.fotoAntes) ? t.fotoAntes : null,
        fotoDespues: esFotoValida(t.fotoDespues) ? t.fotoDespues : null,
        nota: typeof t.nota === 'string' ? t.nota.slice(0, MAX_NOTA) : '',
        fin: typeof t.fin === 'number' && isFinite(t.fin) && t.fin > 0 ? t.fin : null,
        ubicacion: sanearUbicacion(t.ubicacion)
      };
      if (o.estado === 'hecha' && (!o.fotoAntes || !o.fotoDespues || o.fin === null)) { o.estado = 'pendiente'; o.fin = null; }
      tareas[id] = o;
    });
    var dia = typeof raw.dia === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw.dia) ? raw.dia : null;
    return { version: 1, operario: op, dia: dia, fichajes: fich, tareas: tareas };
  }

  var api = {
    MAX_FOTO: MAX_FOTO, MAX_FICHAJES: MAX_FICHAJES, MAX_NOTA: MAX_NOTA,
    calcularHoras: calcularHoras, dividirJornada: dividirJornada, formatoDuracion: formatoDuracion,
    estadoFichaje: estadoFichaje, turnoVencido: turnoVencido, MAX_TURNO: MAX_TURNO, csvSeguro: csvSeguro, esFotoValida: esFotoValida,
    puedeCompletar: puedeCompletar, sanearEstado: sanearEstado
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else raiz.Logica = Object.freeze(api);
})(this);
</script>

        el('span', { class: 'icono', bg: tipo.color }, icono(tipo.icono)),
        el('div', null, el('h2', { text: base.titulo }), el('div', { class: 'suave', text: tipo.nombre + ' · ' + base.hora }))));
    main.appendChild(el('section', { class: 'tarjeta' },
      el('div', { class: 'suave', text: 'Lugar' }), el('div', { class: 'indicaciones' }, el('strong', { text: base.lugar })),
      el('div', { class: 'suave', text: 'Qué hacer' }), el('p', { class: 'indicaciones', text: base.instrucciones })));

    if (bloq) {
      main.appendChild(el('div', { class: 'aviso bloq', attrs: { role: 'alert' } }, icono('candado'),
        el('span', null, 'No hacer esta tarea. ' + bloq,
          el('span', { class: 'accion', text: 'Seguí con tu próxima tarea. Si alguien te pide hacerla, llamá a Administración.' }))));
      return main;
    }
    if (hecha) {
      main.appendChild(el('div', { class: 'aviso ok' }, icono('check'),
        el('span', null, 'Tarea registrada a las ' + hhmm(d.fin) + '.',
          el('span', { class: 'accion', text: 'En la demo queda guardada en este celular hasta el final del día. En la versión final queda como constancia en el servidor.' }))));
      main.appendChild(el('section', { class: 'tarjeta' },
        el('div', { class: 'fila-dato' }, el('span', { text: 'Ubicación al terminar' }),
          d.ubicacion
            ? el('span', { text: d.ubicacion.lat.toFixed(5) + ', ' + d.ubicacion.lon.toFixed(5) + (d.ubicacion.precision !== null ? ' (±' + d.ubicacion.precision + ' m)' : '') })
            : el('span', { class: 'etq alerta', text: 'Sin ubicación · avisá a tu encargado' })),
        d.nota ? el('div', { class: 'fila-dato' }, el('span', { text: 'Nota' }), el('span', { text: d.nota })) : null,
        el('h3', { text: 'Antes' }), el('img', { class: 'foto', attrs: { src: d.fotoAntes, alt: 'Foto de antes' } }),
        el('h3', { text: 'Después' }), el('img', { class: 'foto', attrs: { src: d.fotoDespues, alt: 'Foto de después' } })));
      return main;
    }
    if (!estaDentro()) {
      main.appendChild(el('div', { class: 'aviso atencion', attrs: { role: 'alert' } }, icono('reloj'),
        el('span', null, 'Primero marcá tu entrada.',
          el('span', { class: 'accion', text: 'Las tareas se registran dentro de tu horario de trabajo.' }),
          el('button', { class: 'boton primario', attrs: { type: 'button' }, on: { click: function () { fichar('entrada'); } } }, icono('entrar'), 'MARCAR ENTRADA AHORA'))));
      return main;
    }

    function paso(n, listo, titulo, ayuda, extra, idTitulo) {
      return el('div', { class: 'paso' },
        el('span', { class: 'num' + (listo ? ' listo' : ''), text: listo ? '✓' : String(n), attrs: { 'aria-hidden': 'true' } }),
        el('div', { class: 'cont' }, el('strong', { text: titulo + (listo ? ' · listo' : ''), attrs: idTitulo ? { id: idTitulo } : {} }), el('div', { class: 'suave', text: ayuda }), extra));
    }
    var nota = el('textarea', { attrs: { maxlength: String(L.MAX_NOTA), placeholder: 'Ej.: número de urna, material usado, algo para avisar…', 'aria-labelledby': 'titulo-nota' } });
    nota.value = d.nota || '';
    nota.addEventListener('change', function () {
      var previa = d.nota; d.nota = nota.value.slice(0, L.MAX_NOTA);
      if (!guardar()) { d.nota = previa; aviso(MSG_ESPACIO); }
    });

    main.appendChild(el('section', { class: 'tarjeta' },
      paso(1, !!d.fotoAntes, 'Foto de ANTES', 'Sacala antes de empezar.',
        el('div', null,
          d.fotoAntes ? el('img', { class: 'foto', attrs: { src: d.fotoAntes, alt: 'Foto de antes' } }) : null,
          el('button', { class: 'boton secundario', attrs: { type: 'button' }, on: { click: function () { pedirFoto(base, 'fotoAntes'); } } }, icono('camara'), d.fotoAntes ? 'Repetir foto' : 'Sacar foto de antes'))),
      paso(2, !!d.fotoDespues, 'Foto de DESPUÉS', 'Sacala con el trabajo terminado.',
        el('div', null,
          d.fotoDespues ? el('img', { class: 'foto', attrs: { src: d.fotoDespues, alt: 'Foto de después' } }) : null,
          el('button', { class: 'boton secundario', attrs: { type: 'button' }, on: { click: function () { pedirFoto(base, 'fotoDespues'); } } }, icono('camara'), d.fotoDespues ? 'Repetir foto' : 'Sacar foto de después'))),
      paso(3, !!d.nota, 'Nota (opcional)', 'Cualquier dato útil para Administración.', nota, 'titulo-nota')));

    var chequeo = L.puedeCompletar(Object.assign({}, t, { fotoAntes: d.fotoAntes, fotoDespues: d.fotoDespues }));
    // El botón siempre se puede tocar: si falta algo, dice qué falta.
    var btn = el('button', { class: 'boton ' + (chequeo.ok ? 'primario' : 'falta'), attrs: { type: 'button' } },
      icono(chequeo.ok ? 'check' : 'alerta'), el('span', { text: chequeo.ok ? 'MARCAR COMO HECHA' : chequeo.motivo }));
    btn.addEventListener('click', function () {
      var c = L.puedeCompletar(Object.assign({}, t, { fotoAntes: d.fotoAntes, fotoDespues: d.fotoDespues }));
      if (!c.ok) { aviso(c.motivo); return; }
      btn.disabled = true; btn.lastChild.textContent = 'Guardando ubicación…';
      var notaPrevia = d.nota;
      d.nota = nota.value.slice(0, L.MAX_NOTA);
      pedirUbicacion().then(function (ubic) {
        d.estado = 'hecha'; d.fin = Date.now(); d.ubicacion = ubic;
        if (!guardar()) {
          d.estado = 'en_curso'; d.fin = null; d.ubicacion = null; d.nota = notaPrevia;
          btn.disabled = false; btn.lastChild.textContent = 'MARCAR COMO HECHA';
          aviso(MSG_ESPACIO); return;
        }
        ir('tareas');
        aviso(ubic ? 'Tarea registrada a las ' + hhmm(d.fin) + '.'
          : 'Tarea registrada a las ' + hhmm(d.fin) + ', pero no se pudo guardar dónde estabas. Activá la ubicación del celular y avisá a tu encargado.');
      });
    });
    main.appendChild(btn);
    main.appendChild(el('p', { class: 'suave', text: 'Al marcarla como hecha se guarda la hora y la ubicación de ese momento. No se sigue tu ubicación en ningún otro momento.' }));
    return main;
  }

  // ---------- Pantalla: mis horas ----------
  function pantallaHoras() {
    var ev = fichajesOperario(), ahora = Date.now(), hoy = new Date();
    var filas = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - i);
      var r = L.calcularHoras(ev, inicioDia(d), finDia(d), ahora);
      var j = L.dividirJornada(r.ms, JORNADA_HORAS);
      filas.push({ fecha: d, ms: r.ms, anomalias: r.anomalias, normales: j.normalesMin, extras: j.extrasMin });
    }
    var tot = filas.reduce(function (a, f) { return { ms: a.ms + f.ms, extras: a.extras + f.extras }; }, { ms: 0, extras: 0 });
    var hoyF = filas[filas.length - 1];
    var main = el('main', { class: 'contenido' }, el('h2', { text: 'Mis horas' }),
      el('div', { class: 'kpis' },
        el('div', { class: 'kpi' }, el('div', { class: 'v', text: L.formatoDuracion(hoyF.ms) }), el('div', { class: 'l', text: 'Hoy' })),
        el('div', { class: 'kpi' }, el('div', { class: 'v', text: L.formatoDuracion(tot.ms) }), el('div', { class: 'l', text: 'Últimos 7 días' })),
        el('div', { class: 'kpi' }, el('div', { class: 'v', text: L.formatoDuracion(tot.extras * 60000) }), el('div', { class: 'l', text: 'Extras (más de ' + JORNADA_HORAS + ' h en el día)' })),
        el('div', { class: 'kpi' }, el('div', { class: 'v', text: String(misTareas().filter(function (b) { return datosTarea(b.id).estado === 'hecha'; }).length) }), el('div', { class: 'l', text: 'Tareas hechas hoy' }))));
    var tbody = el('tbody');
    filas.slice().reverse().forEach(function (f) {
      tbody.appendChild(el('tr', null,
        el('td', { text: DIAS[f.fecha.getDay()] + ' ' + fechaCorta(f.fecha) }),
        el('td', { class: 'n', text: L.formatoDuracion(f.ms) }),
        el('td', { class: 'n', text: f.extras ? L.formatoDuracion(f.extras * 60000) : '—' }),
        el('td', { class: 'n', text: f.anomalias ? '⚠ ' + f.anomalias : '—' })));
    });
    main.appendChild(el('section', { class: 'tarjeta' },
      el('table', null, el('thead', null, el('tr', null, el('th', { text: 'Día' }), el('th', { class: 'n', text: 'Trabajado' }), el('th', { class: 'n', text: 'Extras' }), el('th', { class: 'n', text: 'A revisar' }))), tbody),
      el('p', { class: 'suave', text: 'Cada turno cuenta en el día en que marcaste la entrada. Si un registro no cierra (por ejemplo, una entrada que quedó más de 14 h sin salida), no se suma y Administración lo revisa. Hoy incluye tu turno en curso hasta ahora.' })));
    main.appendChild(el('button', { class: 'boton primario', attrs: { type: 'button' }, on: { click: function () { descargarCSV(filas); } } }, 'Descargar mis horas (planilla)'));
    main.appendChild(el('p', { class: 'suave', text: 'En la demo la hora sale del reloj del celular. En la versión final la pone el servidor, para que nadie pueda adelantar o atrasar el reloj, y el contador la descarga desde Administración.' }));
    return main;
  }
  function descargarCSV(filas) {
    var op = operarioActual();
    var lineas = [['Operario', 'Fecha', 'Minutos trabajados', 'Horas', 'Normales (min)', 'Extras (min)', 'Registros a revisar'].map(L.csvSeguro).join(';')];
    filas.forEach(function (f) {
      lineas.push([op.nombre, hoyStr(f.fecha), Math.floor(f.ms / 60000), L.formatoDuracion(f.ms), f.normales, f.extras, f.anomalias].map(L.csvSeguro).join(';'));
    });
    var blob = new Blob(['﻿' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { attrs: { href: url, download: 'horas-' + op.id + '-' + hoyStr() + '.csv' } });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    aviso('Planilla descargada. Se abre con Excel en la computadora.');
  }

  // ---------- Barra inferior ----------
  function renderNav() {
    var nav = document.getElementById('nav'), cont = document.getElementById('nav-in');
    cont.replaceChildren();
    if (!estado.operario) { nav.hidden = true; return; }
    nav.hidden = false;
    [['tareas', 'Mis tareas', 'lista'], ['horas', 'Mis horas', 'reloj']].forEach(function (b) {
      var activo = vista.pantalla === b[0] || (b[0] === 'tareas' && vista.pantalla === 'detalle');
      var attrs = { type: 'button' }; if (activo) attrs['aria-current'] = 'page';
      cont.appendChild(el('button', { attrs: attrs, on: { click: function () { ir(b[0]); } } }, icono(b[2]), b[1]));
    });
  }

  function render() {
    if (revisarCambioDeDia()) { guardar(); if (vista.pantalla === 'detalle') vista.pantalla = 'tareas'; }
    var cuerpo;
    if (!estado.operario) cuerpo = pantallaPerfil();
    else if (vista.pantalla === 'detalle') cuerpo = pantallaDetalle();
    else if (vista.pantalla === 'horas') cuerpo = pantallaHoras();
    else cuerpo = pantallaTareas();
    document.getElementById('app').replaceChildren(barra(), bandaDemo(!estado.operario), cuerpo);
    renderNav();
  }

  cargar();
  window.addEventListener('online', render);
  window.addEventListener('offline', render);
  setInterval(function () { if (vista.pantalla !== 'detalle' && estado.operario) render(); }, 30000);
  render();
})();
</script>
