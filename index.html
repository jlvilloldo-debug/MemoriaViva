<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-7H/ssJDnevy5YOaKhztN9J/IwskwJrd1tuQDbnHmw08=' 'sha256-/jWPVrmCKDYBsK4HCrLBApdoY1VEU6KcOoLrcAso0WU=' 'sha256-zXOa3Kwzh31jEVFNCDfcCpSWAj6FuDMOfeFRNvyglus='; style-src 'sha256-8k8aRbXv+S0j8yY1Q5Ivk2MF+lYUfCfqvoeCSBzCyeY='; img-src data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; connect-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Memoria Viva · Administración</title>
<style>
:root{
  --verde:#1D8348; --verde-osc:#145A32; --oliva:#556B2F; --piedra:#7B7D7D; --grafito:#2E3436;
  --fondo:#F2F4F1; --tarjeta:#FFFFFF; --texto:#1F2421; --suave:#4F5652; --borde:#B4BFB8; --linea:#DCE2DD;
  --e-disponible:#1D8348; --e-tramite:#F4D03F; --e-ocupado:#B03A2E; --e-reservado:#2471A3; --e-observado:#A04000;
  --enlace:#166B3A; --foco:#1F2421; --radio:14px; --error:#B03A2E; --alerta-txt:#873600; --ok-txt:#1D8348; --borde-campo:#8A968F; --sombra:0 2px 10px rgba(20,40,30,.07);
}
@media (prefers-color-scheme: dark){
  :root{ --fondo:#121614; --tarjeta:#1C2220; --texto:#E8EDEA; --suave:#B3BCB7; --borde:#45514B; --linea:#2E3733; --enlace:#7DD3A0; --foco:#E8EDEA; --sombra:none; --error:#F1948A; --alerta-txt:#F0B27A; --ok-txt:#7DD3A0; --borde-campo:#7F8C86; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--texto);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.barra{background:var(--verde-osc);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{font-weight:800;font-size:18px;letter-spacing:.2px;flex:1;min-width:200px;background:none;border:0;color:#fff;text-align:left;padding:6px 0}
.marca small{display:block;font-weight:400;font-size:13px;opacity:.85}
.barra label{font-size:13px;opacity:.9}
.barra select{background:#fff;color:#1F2421;border:0;border-radius:10px;padding:8px 10px;min-height:40px;font-weight:600}
.demo{background:#FEF9E7;color:#5E4D05;font-size:14px;padding:8px 20px;border-bottom:1px solid #F4E3A1}
@media (prefers-color-scheme: dark){.demo{background:#2A2610;color:#E8D67A;border-color:#4A4220}}
.contenido{max-width:1320px;margin:0 auto;padding:20px}
h1{font-size:24px;margin:4px 0 4px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 8px}
.suave{color:var(--suave)}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px}
/* Inicio */
.inicio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
.modulo{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:0;border-radius:18px;padding:22px;color:#fff;min-height:190px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.modulo:hover{transform:translateY(-2px)}
.modulo svg{width:40px;height:40px}
.modulo strong{font-size:19px}
.modulo span{font-size:14px;opacity:.95}
.modulo .estado-mod{margin-top:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:8px}
/* Barra de herramientas del módulo */
.volver{background:none;border:0;color:var(--enlace);font-weight:700;padding:8px 0;min-height:44px}
.herr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 14px}
.seg{display:inline-flex;border:2px solid var(--borde);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--tarjeta);padding:8px 14px;font-weight:700;min-height:42px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--verde);color:#fff}
.buscar{flex:1;min-width:220px;display:flex;gap:8px}
.buscar input{flex:1;border:2px solid var(--borde-campo);border-radius:12px;padding:9px 12px;background:var(--tarjeta);min-height:44px}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-bottom:12px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.muestra{width:16px;height:16px;border-radius:4px;display:inline-block}
.boton{border:0;border-radius:12px;padding:10px 16px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.boton.primario{background:var(--verde);color:#fff}
.boton.secundario{background:var(--tarjeta);border:2px solid var(--enlace);color:var(--enlace)}
.boton.peligro{background:var(--tarjeta);border:2px solid var(--error);color:var(--error)}
.boton:disabled{background:var(--linea);color:var(--suave);border-color:var(--linea);cursor:not-allowed}
.boton svg{width:20px;height:20px}
/* Mapa */
.vistas{display:grid;gap:16px}
.vistas.dividida{grid-template-columns:1fr 1fr}
@media (max-width:1100px){.vistas.dividida{grid-template-columns:1fr}}
.op-titulo{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.op-chip{color:#fff;border-radius:8px;padding:2px 8px;font-size:13px}
.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.zona{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);padding:10px}
.zona h3{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.zona h3 small{font-weight:400;color:var(--suave)}
.grilla{display:grid;gap:3px}
.celda{border:0;border-radius:5px;min-height:30px;font-size:10px;font-weight:700;padding:0;color:#fff;position:relative;line-height:1}
.celda.disponible{background:var(--e-disponible)}
.celda.tramite{background:var(--e-tramite);color:#3D3200}
.celda.mio{background:var(--e-tramite);color:#3D3200;box-shadow:inset 0 0 0 3px #1F2421}
.celda.ocupado{background:var(--e-ocupado)}
.celda.reservado{background:var(--e-reservado)}
.celda.observado{background:var(--e-observado)}
.celda.elegida{outline:3px solid var(--foco);outline-offset:2px;z-index:1}
.celda.hallada{animation:pulso 1s ease-in-out 4;outline:4px solid #F4D03F;outline-offset:2px;z-index:2}
@keyframes pulso{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){.celda.hallada{animation:none}}
.celda .lleno{position:absolute;left:3px;right:3px;bottom:3px;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.celda .lleno i{display:block;height:100%;background:#fff}
.edificio{display:flex;flex-direction:column;gap:8px;align-items:flex-start;justify-content:center;min-height:120px;border:2px dashed var(--borde);border-radius:12px;padding:12px;width:100%;background:none;text-align:left}
.provisorio{font-size:13px;color:var(--suave);margin:6px 0 0}
.plano{width:100%;height:auto;display:block;border-radius:16px;background:#FBFAF5;border:1px solid var(--borde)}
.p-fondo{fill:#FBFAF5}
.p-pasto{fill:#AFC27A;pointer-events:none}
.p-sector polygon{fill:#AFC27A;transition:fill .15s}
.p-sector{cursor:pointer;outline:none}
.p-sector:hover polygon,.p-sector:focus-visible polygon{fill:#8FAA55}
.p-sector:focus-visible polygon{stroke:#1F2421;stroke-width:5}
.p-sector.p-lleno polygon{fill:#C7CBB4}
.p-caminos path{fill:none;stroke:#D6D9D9;stroke-width:20;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.p-estacionamiento{fill:#E3E5E5;pointer-events:none}
.p-lineas path{fill:none;stroke:#1F2421;stroke-width:3;pointer-events:none}
.p-edificio{fill:#C8A06A;stroke:#D6D9D9;stroke-width:6}
.p-click{cursor:pointer;outline:none}
.p-click:hover .p-edificio,.p-click:focus-visible .p-edificio,.p-click:hover .p-muro,.p-click:focus-visible .p-muro{stroke:#1F2421;stroke-width:4}
.p-fuente{fill:#7FB8DE;stroke:#D6D9D9;stroke-width:6;pointer-events:none}
.p-pedestal{fill:#2E7D32;pointer-events:none}
.p-estatua{fill:#FFFFFF;stroke:#B9B9B9;pointer-events:none}
.p-torre{fill:#8E5B47}
.p-techo{fill:#3A3A3A}
.p-muro{fill:#A0522D}
.p-entrada{fill:#2C2C7A;pointer-events:none}
.p-e{fill:#fff;font-weight:800;font-size:20px;pointer-events:none}
.p-nombre{font-size:24px;font-weight:800;fill:#1F2421;font-variant:small-caps;letter-spacing:.5px;pointer-events:none}
.p-chico{font-size:19px}
.p-libres{font-size:17px;font-weight:700;fill:#145A32;pointer-events:none}
/* Ficha lateral */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--tarjeta);border-left:1px solid var(--borde);box-shadow:-8px 0 24px rgba(0,0,0,.15);z-index:20;overflow:auto;padding:18px}
.panel-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.cerrar{border:0;background:var(--linea);border-radius:10px;min-width:44px;min-height:44px;font-size:20px;font-weight:800}
.chip{display:inline-block;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:800;color:#fff}
.chip.tramite,.chip.mio{color:#3D3200}
.barra-cap{height:12px;background:var(--linea);border-radius:999px;overflow:hidden;margin:6px 0 2px}
.barra-cap i{display:block;height:100%;background:var(--e-ocupado)}
.dato{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--linea)}
.dato span:last-child{font-weight:700;text-align:right}
.lista{list-style:none;padding:0;margin:6px 0}
.lista li{padding:8px 10px;border:1px solid var(--linea);border-radius:10px;margin-bottom:6px}
.aviso{border-radius:12px;padding:12px;margin:10px 0;font-weight:600}
.aviso svg,.buscar svg{width:22px;height:22px;vertical-align:-5px;flex:none}
.buscar > div:first-child{display:flex;align-items:center;color:var(--suave)}
.aviso.bloq{background:#FAE5D3;color:#6E2C00;border:2px solid #E59866}
.aviso.ok{background:#D5F5E3;color:#145A32;border:2px solid #82E0AA}
.aviso.info{background:#EAF2F8;color:#1B4F72;border:2px solid #A9CCE3}
.acciones{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.reloj-bloqueo{font-variant-numeric:tabular-nums}
/* Asistente */
.velo{position:fixed;inset:0;background:rgba(10,20,15,.55);z-index:30;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.asistente{background:var(--tarjeta);border-radius:18px;width:min(760px,100%);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.pasos{display:flex;gap:6px;margin:10px 0 18px}
.pasos div{flex:1;height:8px;border-radius:999px;background:var(--linea)}
.pasos div.hecho{background:var(--verde)}
.pasos-txt{display:flex;justify-content:space-between;font-size:13px;color:var(--suave);gap:6px}
.pasos-txt span.actual{color:var(--texto);font-weight:800}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.campo label{font-weight:700;font-size:14px}
.campo input,.campo select{border:2px solid var(--borde-campo);border-radius:10px;padding:10px;background:var(--tarjeta);min-height:44px}
.campo .error{color:var(--error);font-size:13px;font-weight:700;min-height:1em}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.fila2{grid-template-columns:1fr}.mapa{grid-template-columns:1fr}}
.pie-asis{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.titulo-doc{border:3px double var(--verde);border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.titulo-doc canvas{width:180px;height:180px;image-rendering:pixelated;background:#fff;border-radius:8px}
.cuotas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cuotas span{background:var(--linea);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700}
.marca-check{display:flex;gap:10px;align-items:flex-start;padding:10px;border:2px solid var(--borde);border-radius:12px;margin-bottom:12px}
.marca-check input{width:22px;height:22px;margin-top:2px}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.soltar{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:3px dashed var(--borde);border-radius:16px;padding:34px 16px;cursor:pointer;margin:10px 0}
.soltar svg{width:42px;height:42px;color:var(--enlace)}
.soltar.encima,.soltar:hover{border-color:var(--verde);background:rgba(29,131,72,.06)}
#imp-archivo:focus-visible + .soltar{outline:3px solid var(--foco);outline-offset:2px}
.tabla-scroll{overflow:auto;max-width:100%;border:1px solid var(--linea);border-radius:10px;margin:8px 0}
table.previa{border-collapse:collapse;width:100%;font-size:13px}
table.previa th,table.previa td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--linea);white-space:nowrap}
table.previa th{background:var(--linea)}
.kpis-imp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.kpi-imp{border:1px solid var(--borde);border-radius:12px;padding:12px;display:flex;flex-direction:column}
.kpi-imp strong{font-size:26px}
.kpi-imp.ok strong{color:var(--ok-txt)}
.kpi-imp.mal strong{color:var(--error)}
.agenda{display:grid;gap:8px;align-items:stretch;margin-top:8px}
.ag-cab{font-weight:800;padding:8px;background:var(--linea);border-radius:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ag-hora{font-weight:800;padding:10px 4px;font-variant-numeric:tabular-nums}
.ag-libre{border:2px dashed var(--borde);background:none;border-radius:12px;min-height:84px;font-weight:800;color:var(--enlace)}
.ag-libre:hover{border-color:var(--verde);background:rgba(29,131,72,.06)}
.ag-libre.mant{display:flex;align-items:center;justify-content:center;color:var(--suave);background:repeating-linear-gradient(45deg,transparent,transparent 8px,var(--linea) 8px,var(--linea) 16px)}
.ag-serv{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--borde);border-radius:12px;padding:10px;background:var(--tarjeta);min-height:84px}
.falta-doc{font-size:13px;font-weight:700;color:var(--alerta-txt)}
.chip-btn{border:0;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800;background:#D5F5E3;color:#145A32;min-height:32px}
.chip-btn.mant{background:#FAE5D3;color:#873600}
.custodia{list-style:none;padding:0;margin:6px 0 12px;border-left:3px solid var(--linea)}
.custodia li{padding:6px 12px;position:relative;color:var(--suave)}
.custodia li::before{content:'';position:absolute;left:-8px;top:12px;width:13px;height:13px;border-radius:50%;background:var(--linea)}
.custodia li.hecho{color:var(--texto)}
.custodia li.hecho::before{background:var(--verde)}
.titulo-doc.etiqueta{grid-template-columns:1fr auto;margin-bottom:8px}
.titulo-doc.etiqueta canvas{width:120px;height:120px}
.titulo-doc.acta{display:block}
.horario{display:grid;grid-template-columns:200px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--linea)}
@media (max-width:900px){.horario{grid-template-columns:1fr}}
.dias{display:flex;flex-wrap:wrap;gap:6px}
.dias label{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--borde);border-radius:10px;padding:6px 8px;font-weight:700;font-size:13px;min-height:40px}
.horas{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.horas input,.herr input[type=date]{border:2px solid var(--borde);border-radius:10px;padding:8px;background:var(--tarjeta);min-height:44px}
.panel .boton{width:100%;margin-top:8px}
.panel.angosta{width:min(360px,100%)}
.barra-cap.neutra i{background:var(--verde)}
.espacio-arriba{margin-top:14px}
.panel p.suave{margin:8px 0 14px}
.p-libres{fill:#0F4A28}
.deuda{color:var(--error);font-size:20px}
.al-dia{color:var(--ok-txt);font-size:20px}
.chip.est-pagada{background:#D5F5E3;color:#145A32}
.chip.est-vencida{background:#FADBD8;color:#922B21}
.chip.est-pendiente{background:#EAECEE;color:#424949}
tr.cuota-vencida td{background:rgba(176,58,46,.05)}
td.n,th.n{text-align:right}
.cobrar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cobrar select{border:2px solid var(--borde);border-radius:10px;padding:9px;min-height:44px;background:var(--tarjeta)}
.enlace-wa{color:var(--enlace);font-weight:700}
.dato.total span{font-size:18px;font-weight:800}
.comprobante{border-style:double}
.campo input:not([type]){border:2px solid var(--borde);border-radius:10px;padding:10px;background:var(--tarjeta);min-height:44px}
a.boton{text-decoration:none}
/* Módulos en construcción */
.plan{columns:2 280px;gap:16px}
.plan li{break-inside:avoid;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--grafito);color:#fff;border-radius:14px;padding:12px 16px;z-index:40;max-width:calc(100% - 32px);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
@media print{
  body *{visibility:hidden}
  .titulo-doc,.titulo-doc *{visibility:visible}
  .titulo-doc{position:absolute;left:0;top:0;width:100%}
}
</style>
</head>
